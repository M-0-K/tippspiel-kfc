; KFC Tippspiel - PHP-Einstellungen
; Session für den ganzen Abend (12 h), auch wenn das Handy gesperrt wird
session.cookie_lifetime = 43200
session.gc_maxlifetime = 43200
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Fehler loggen, aber nicht im Browser anzeigen
display_errors = Off
log_errors = On

date.timezone = Europe/Berlin
